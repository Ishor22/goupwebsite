<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>दाजुभाइ समूह</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container header-flex">
      <div>
        <h1>प्रदेशी दाजुभाइ समूह</h1>
        <p class="subtitle">Dajubhai Group</p>
      </div>
      <nav class="top-menu">
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="members container">
      <h2>दाजुभाइहरू</h2>
      <ol id="brothers-list"></ol>
    </section>
  </main>
  <footer>
    <div class="container">
      <p>© 2026 प्रदेशी दाजुभाइ समूह</p>
    </div>
  </footer>
  <script>
    const storageKey = 'brothersList';
    const defaultBrothers = ['राम थापा', 'हरी कुमार'];
    const brothersList = document.getElementById('brothers-list');

    function renderBrothers(brothers) {
      brothersList.innerHTML = '';
      if (!brothers || brothers.length === 0) {
        brothersList.innerHTML = '<li>कुनै दाजुभाइ छैनन्।</li>';
        return;
      }
      brothers.forEach(name => {
        const li = document.createElement('li');
        li.textContent = name;
        brothersList.appendChild(li);
      });
    }

    function getLocalBrothers() {
      try {
        const stored = localStorage.getItem(storageKey);
        return stored ? JSON.parse(stored) : null;
      } catch {
        return null;
      }
    }

    const localBrothers = getLocalBrothers();
    if (localBrothers) {
      renderBrothers(localBrothers);
    } else {
      fetch('/api/getBrothers')
        .then(response => response.ok ? response.json() : Promise.reject('Fetch failed'))
        .then(data => renderBrothers(data.brothers))
        .catch(() => renderBrothers(defaultBrothers));
    }
  </script>
</body>
</html>
