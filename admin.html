<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admins Panel - दाजुभाइ समूह</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container header-flex">
      <div>
        <h1>एडमिन प्यानल</h1>
        <p class="subtitle">दाजुभाइ समूह नाम सम्पादन गर्नुहोस्</p>
      </div>
      <nav class="top-menu">
        <a href="index.html">Home</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="admin-panel container">
      <h2>दाजुभाइहरूको सूची</h2>
      <p>यहाँ दाजुभाइहरूको नाम सम्पादन गर्नुहोस् र सेभ गर्नुहोस्।</p>
      <div class="form-group">
        <label for="brothers-input">दाजुभाइहरूको नाम (प्रत्येक नयाँ लाइनमा)</label>
        <textarea id="brothers-input" rows="8" placeholder="राम थापा&#10;हरी कुमार"></textarea>
      </div>
      <div class="admin-actions">
        <button id="save-button" class="save-button">सेभ गर्नुहोस्</button>
      </div>
      <p id="admin-message" class="admin-message">लोड हुँदैछ...</p>
      <p class="admin-note">टोकन वा पासवर्ड आवश्यक छैन। backendले `brothers.json`लाई अपडेट गर्छ।</p>
    </section>
  </main>
  <footer>
    <div class="container">
      <p>© 2026 प्रदेशी दाजुभाइ समूह</p>
    </div>
  </footer>
  <script>
    const defaultBrothers = ['राम थापा', 'हरी कुमार'];
    const brothersInput = document.getElementById('brothers-input');
    const saveButton = document.getElementById('save-button');
    const adminMessage = document.getElementById('admin-message');

    function renderInput(brothers) {
      brothersInput.value = brothers.join('\n');
      adminMessage.textContent = 'नामहरू लोड भयो। सेभ गर्नुहोस्।';
      adminMessage.style.color = '#2a6f97';
    }

    function showMessage(message, isError = false) {
      adminMessage.textContent = message;
      adminMessage.style.color = isError ? '#b00020' : '#2a6f97';
    }

    fetch('/api/getBrothers')
      .then(response => response.ok ? response.json() : Promise.reject('Fetch failed'))
      .then(data => renderInput(data.brothers || defaultBrothers))
      .catch(() => renderInput(defaultBrothers));

    saveButton.addEventListener('click', async () => {
      const brothers = brothersInput.value
        .split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0);

      if (brothers.length === 0) {
        showMessage('कम्तिमा एक दाजुभाइको नाम लेख्नुहोस्।', true);
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = 'सेभ हुँदैछ...';

      try {
        const response = await fetch('/api/updateBrothers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ brothers }),
        });
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Save failed');
        }

        showMessage('सेभ सफल भयो। पेज रिफ्रेश गर्नुहोस्।');
      } catch (error) {
        showMessage(error.message || 'सेभ गर्दा समस्या भयो।', true);
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = 'से्भ गर्नुहोस्';
      }
    });
  </script>
</body>
</html>
