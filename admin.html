<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admins Panel - दाजुभाइ समूह</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container header-flex">
      <div>
        <h1>एडमिन प्यानल</h1>
        <p class="subtitle">दाजुभाइ समूह नाम सम्पादन गर्नुहोस्</p>
      </div>
      <nav class="top-menu">
        <a href="index.html">Home</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="admin-panel container">
      <h2>दाजुभाइहरूको सूची</h2>
      <p>यो साइटमा सबै उपकरणमा एउटै डेटा पठाउन <strong>GitHub मा सहेज्नुहोस्</strong>.</p>
      <textarea id="brothers-input" rows="8" readonly></textarea>
      <div class="admin-actions">
        <a href="https://github.com/Ishor22/goupwebsite/edit/main/brothers.json" target="_blank" class="save-button">GitHub मा सम्पादन गर्नुहोस्</a>
      </div>
      <p id="admin-message" class="admin-message">Edit the shared file to keep the same data everywhere.</p>
    </section>
  </main>
  <footer>
    <div class="container">
      <p>© 2026 प्रदेशी दाजुभाइ समूह</p>
    </div>
  </footer>
  <script>
    const defaultBrothers = ['राम थापा', 'हरी कुमार'];
    const brothersInput = document.getElementById('brothers-input');
    const adminMessage = document.getElementById('admin-message');

    function renderInput(brothers) {
      brothersInput.value = brothers.join('\n');
    }

    fetch('brothers.json')
      .then(response => response.ok ? response.json() : Promise.reject('Fetch failed'))
      .then(data => renderInput(data.brothers || defaultBrothers))
      .catch(() => renderInput(defaultBrothers));
  </script>
</body>
</html>
