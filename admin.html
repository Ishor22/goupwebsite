<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admins Panel - दाजुभाइ समूह</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container header-flex">
      <div>
        <h1>एडमिन प्यानल</h1>
        <p class="subtitle">दाजुभाइ समूह नाम सम्पादन गर्नुहोस्</p>
      </div>
      <nav class="top-menu">
        <a href="index.html">गृहपृष्ठ</a>
      </nav>
    </div>
  </header>
  <main>
    <!-- Login screen: shown until Supabase confirms an authenticated session -->
    <section id="login-section" class="admin-panel container">
      <h2>एडमिन लगइन</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Username or Email</label>
          <input type="email" id="login-email" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <div class="admin-actions">
          <button type="submit" id="login-button" class="save-button">Login</button>
        </div>
      </form>
      <p id="login-message" class="admin-message"></p>
    </section>

    <!-- Dashboard: only rendered after a successful, server-verified login -->
    <section id="dashboard-section" class="admin-panel container hidden">
      <div class="dashboard-header">
        <h2 id="welcome-message">Welcome, Admin</h2>
        <button id="logout-button" class="cancel-button">Logout</button>
      </div>

      <div class="form-group">
        <label for="new-brother-name">नयाँ दाजुभाइको नाम थप्नुहोस्</label>
        <div class="inline-form">
          <input type="text" id="new-brother-name" placeholder="नाम लेख्नुहोस्" />
          <button id="add-button" class="save-button">थप्नुहोस्</button>
        </div>
      </div>

      <p id="dashboard-message" class="admin-message"></p>

      <ul id="brothers-admin-list" class="admin-brothers-list"></ul>
    </section>
  </main>
  <footer>
    <div class="container">
      <p>© 2026 प्रदेशी दाजुभाइ समूह</p>
    </div>
  </footer>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const loginForm = document.getElementById('login-form');
    const loginEmail = document.getElementById('login-email');
    const loginPassword = document.getElementById('login-password');
    const loginButton = document.getElementById('login-button');
    const loginMessage = document.getElementById('login-message');
    const logoutButton = document.getElementById('logout-button');
    const welcomeMessage = document.getElementById('welcome-message');
    const newBrotherName = document.getElementById('new-brother-name');
    const addButton = document.getElementById('add-button');
    const dashboardMessage = document.getElementById('dashboard-message');
    const brothersAdminList = document.getElementById('brothers-admin-list');

    function showLoginMessage(message, isError = true) {
      loginMessage.textContent = message;
      loginMessage.style.color = isError ? '#b00020' : '#2a6f97';
    }

    function showDashboardMessage(message, isError = false) {
      dashboardMessage.textContent = message;
      dashboardMessage.style.color = isError ? '#b00020' : '#2a6f97';
    }

    function showLogin() {
      loginSection.classList.remove('hidden');
      dashboardSection.classList.add('hidden');
    }

    function showDashboard(user) {
      loginSection.classList.add('hidden');
      dashboardSection.classList.remove('hidden');
      welcomeMessage.textContent = `Welcome, ${user.email}`;
    }

    let supabase;

    async function init() {
      let config;
      try {
        const response = await fetch('/api/config');
        if (!response.ok) throw new Error('Config fetch failed');
        config = await response.json();
      } catch {
        showLoginMessage('साइट अहिले उपलब्ध छैन। पछि प्रयास गर्नुहोस्।');
        return;
      }

      supabase = createClient(config.url, config.anonKey);

      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showDashboard(session.user);
        loadBrothers();
      } else {
        showLogin();
      }

      supabase.auth.onAuthStateChange((_event, session) => {
        if (session) {
          showDashboard(session.user);
          loadBrothers();
        } else {
          showLogin();
        }
      });
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      showLoginMessage('');
      loginButton.disabled = true;
      loginButton.textContent = 'लगइन हुँदैछ...';

      const { error } = await supabase.auth.signInWithPassword({
        email: loginEmail.value.trim(),
        password: loginPassword.value,
      });

      loginButton.disabled = false;
      loginButton.textContent = 'Login';

      if (error) {
        showLoginMessage('Invalid email or password.');
        return;
      }

      loginPassword.value = '';
    });

    logoutButton.addEventListener('click', async () => {
      await supabase.auth.signOut();
    });

    async function getAuthHeader() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) throw new Error('Session expired. Please log in again.');
      return { Authorization: `Bearer ${session.access_token}` };
    }

    async function loadBrothers() {
      brothersAdminList.innerHTML = '<li>लोड हुँदैछ...</li>';
      try {
        const response = await fetch('/api/getBrothers');
        if (!response.ok) throw new Error('Fetch failed');
        const data = await response.json();
        renderBrothersAdminList(data.brothers || []);
      } catch {
        brothersAdminList.innerHTML = '<li>सूची लोड गर्न सकिएन।</li>';
      }
    }

    function renderBrothersAdminList(brothers) {
      brothersAdminList.innerHTML = '';
      if (brothers.length === 0) {
        brothersAdminList.innerHTML = '<li>कुनै दाजुभाइ छैनन्।</li>';
        return;
      }

      brothers.forEach((brother) => {
        const li = document.createElement('li');
        li.className = 'admin-brother-row';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'admin-brother-name';
        nameSpan.textContent = brother.name;

        const editInput = document.createElement('input');
        editInput.type = 'text';
        editInput.value = brother.name;
        editInput.className = 'admin-brother-edit-input hidden';

        const editButton = document.createElement('button');
        editButton.textContent = 'सम्पादन';
        editButton.className = 'cancel-button';

        const saveButton = document.createElement('button');
        saveButton.textContent = 'सेभ';
        saveButton.className = 'save-button hidden';

        const cancelButton = document.createElement('button');
        cancelButton.textContent = 'रद्द';
        cancelButton.className = 'cancel-button hidden';

        const deleteButton = document.createElement('button');
        deleteButton.textContent = 'मेटाउनुहोस्';
        deleteButton.className = 'delete-button';

        function enterEditMode() {
          nameSpan.classList.add('hidden');
          editInput.classList.remove('hidden');
          editButton.classList.add('hidden');
          deleteButton.classList.add('hidden');
          saveButton.classList.remove('hidden');
          cancelButton.classList.remove('hidden');
          editInput.value = brother.name;
          editInput.focus();
        }

        function exitEditMode() {
          nameSpan.classList.remove('hidden');
          editInput.classList.add('hidden');
          editButton.classList.remove('hidden');
          deleteButton.classList.remove('hidden');
          saveButton.classList.add('hidden');
          cancelButton.classList.add('hidden');
        }

        editButton.addEventListener('click', enterEditMode);
        cancelButton.addEventListener('click', exitEditMode);

        saveButton.addEventListener('click', async () => {
          const newName = editInput.value.trim();
          if (!newName) {
            showDashboardMessage('नाम खाली हुन सक्दैन।', true);
            return;
          }

          saveButton.disabled = true;
          saveButton.textContent = 'Saving...';
          try {
            const headers = await getAuthHeader();
            const response = await fetch('/api/admin/updateBrother', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', ...headers },
              body: JSON.stringify({ id: brother.id, name: newName }),
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Update failed');

            brother.name = newName;
            nameSpan.textContent = newName;
            exitEditMode();
            showDashboardMessage('Brother updated successfully.');
          } catch (error) {
            showDashboardMessage(error.message || 'सम्पादन गर्दा समस्या भयो।', true);
          } finally {
            saveButton.disabled = false;
            saveButton.textContent = 'सेभ';
          }
        });

        deleteButton.addEventListener('click', async () => {
          const confirmed = confirm('Are you sure you want to delete this brother?');
          if (!confirmed) return;

          deleteButton.disabled = true;
          deleteButton.textContent = 'Saving...';
          try {
            const headers = await getAuthHeader();
            const response = await fetch('/api/admin/deleteBrother', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', ...headers },
              body: JSON.stringify({ id: brother.id }),
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Delete failed');

            li.remove();
            showDashboardMessage('Brother deleted successfully.');
            if (brothersAdminList.children.length === 0) {
              brothersAdminList.innerHTML = '<li>कुनै दाजुभाइ छैनन्।</li>';
            }
          } catch (error) {
            showDashboardMessage(error.message || 'मेटाउँदा समस्या भयो।', true);
            deleteButton.disabled = false;
            deleteButton.textContent = 'मेटाउनुहोस्';
          }
        });

        const actions = document.createElement('div');
        actions.className = 'admin-brother-actions';
        actions.append(editButton, saveButton, cancelButton, deleteButton);

        li.append(nameSpan, editInput, actions);
        brothersAdminList.appendChild(li);
      });
    }

    addButton.addEventListener('click', async () => {
      const name = newBrotherName.value.trim();
      if (!name) {
        showDashboardMessage('कम्तिमा एक नाम लेख्नुहोस्।', true);
        return;
      }

      addButton.disabled = true;
      addButton.textContent = 'Saving...';
      try {
        const headers = await getAuthHeader();
        const response = await fetch('/api/admin/addBrother', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...headers },
          body: JSON.stringify({ name }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Add failed');

        newBrotherName.value = '';
        showDashboardMessage('Brother added successfully.');
        loadBrothers();
      } catch (error) {
        showDashboardMessage(error.message || 'थप्दा समस्या भयो।', true);
      } finally {
        addButton.disabled = false;
        addButton.textContent = 'थप्नुहोस्';
      }
    });

    init();
  </script>
</body>
</html>
